<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FPL Injuries, Suspensions &amp; Team News – FPLSnap</title>
<meta name="description" content="FPL injury and suspension tracker: every flagged player with chance of playing and the latest news, sorted by ownership. Free, no login.">
<link rel="canonical" href="https://fplsnap.com/news.html">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f172a">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!--nav-->
<header class="hero"><div class="in"><h1>FPL Injuries &amp; Suspensions</h1><p>Flagged players, most-owned first. <span id="upd"></span></p></div></header>
<main>
<div class="ad"></div>
<div class="tabs" id="tabs">
<button data-v="all" aria-pressed="true">All flagged</button>
<button data-v="i" aria-pressed="false">Injured</button>
<button data-v="d" aria-pressed="false">Doubtful</button>
<button data-v="s" aria-pressed="false">Suspended</button>
</div>
<div class="bar">
<input id="q" type="search" placeholder="Filter player or team…" aria-label="Filter player or team">
<select id="own" aria-label="Minimum ownership"><option value="0">Any ownership</option><option value="1" selected>Owned by 1%+</option><option value="5">Owned by 5%+</option><option value="10">Owned by 10%+</option></select>
</div>
<div class="wrap"><table id="t"></table></div>
<p style="margin-top:12px">Status and news come from the official FPL data feed and can lag real-world team news. Always check the club's own announcements before a deadline.</p>
<div class="ad"></div>
</main>
<!--foot-->
<script src="app.js"></script>
<script>
let S, redraw, view = 'all';
const ST = { i: ['Injured', '#b91c1c'], d: ['Doubtful', '#a16207'], s: ['Suspended', '#7c3aed'], n: ['Unavailable', '#475569'] };
const who = p => `<span style="display:inline-flex;align-items:center;gap:6px">${chip(S.teams[p.t].short, 1)}<b>${esc(p.n)}</b></span>`;
const cols = [
  { h: 'Player', f: who, v: p => p.n.toLowerCase(), asc: 1 },
  { h: 'Pos', f: p => `<span class="pos">${POS[p.e]}</span>`, v: p => p.e, asc: 1 },
  { h: 'Status', f: p => { const [t, c] = ST[p.st] || ['Note', '#475569']; return `<span class="pill" style="background:${c}">${t}</span>` }, v: p => p.st, asc: 1 },
  { h: 'Chance', cls: 'n', f: p => p.ch == null ? '–' : p.ch + '%', v: p => p.ch ?? -1 },
  { h: 'News', cls: 'w', f: p => esc(p.nw) || '–', v: p => p.nw },
  { h: 'Updated', f: p => p.na ? new Date(p.na).toLocaleDateString([], { day: 'numeric', month: 'short' }) : '–', v: p => p.na || '' },
  { h: 'Owned', cls: 'n', f: p => p.o + '%', v: p => p.o },
];
const flagged = () => S.players.filter(p => p.st !== 'a' || p.nw);
function rows() {
  const q = $('q').value.trim().toLowerCase(), own = +$('own').value;
  return flagged().filter(p => p.o >= own && (view === 'all' || p.st === view) && (!q || p.n.toLowerCase().includes(q) || S.teams[p.t].short.toLowerCase().includes(q)));
}
loadSite().then(s => {
  S = s;
  stamp($('upd'), S.updated);
  redraw = table($('t'), cols, rows(), { sort: 6, limit: 150 });
  $('tabs').onclick = e => { const b = e.target.closest('button'); if (!b) return; view = b.dataset.v; [...$('tabs').children].forEach(x => x.setAttribute('aria-pressed', x === b)); redraw(rows()) };
  $('q').oninput = $('own').onchange = () => redraw(rows());
});
</script>
</body>
</html>
