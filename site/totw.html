<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FPL Team of the Week – FPLSnap</title>
<meta name="description" content="The best-scoring FPL XI of the latest gameweek, picked from every player's points. Free, no login.">
<link rel="canonical" href="https://fplsnap.com/totw.html">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f172a">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!--nav-->
<header class="hero"><div class="in"><h1>FPL Team of the Week</h1><p id="sub"></p></div></header>
<main>
<div class="ad"></div>
<div id="out"></div>
<p style="margin-top:12px">The highest-scoring valid XI (1 GKP, 3-5 DEF, 2-5 MID, 1-3 FWD) from every player's points this gameweek. It is our own calculation, not an official FPL selection. Points can change until bonus points are confirmed.</p>
<div class="ad"></div>
</main>
<!--foot-->
<script src="app.js"></script>
<script>
loadSite().then(S => {
  const gw = S.ev.cur;
  if (!gw) { $('sub').textContent = 'The season has not started yet.'; return }
  const by = e => S.players.filter(p => p.e === e).sort((a, b) => b.ev - a.ev);
  const L = [by(1), by(2), by(3), by(4)];
  const sum = (a, k) => a.slice(0, k).reduce((s, p) => s + p.ev, 0);
  let best = null;
  for (let d = 3; d <= 5; d++) for (let m = 2; m <= 5; m++) { const f = 10 - d - m; if (f < 1 || f > 3) continue;
    const t = sum(L[0], 1) + sum(L[1], d) + sum(L[2], m) + sum(L[3], f); if (!best || t > best.t) best = { d, m, f, t } }
  const xi = [L[0].slice(0, 1), L[1].slice(0, best.d), L[2].slice(0, best.m), L[3].slice(0, best.f)];
  const cap = xi.flat().sort((a, b) => b.ev - a.ev)[0];
  $('sub').textContent = `GW${gw} · ${best.d}-${best.m}-${best.f} · ${best.t + cap.ev} points with ${cap.n} as captain`;
  const pl = p => `<div class="pl">${chip(S.teams[p.t].short)}<span>${esc(p.n)}${p === cap ? ' (C)' : ''}</span><small>${p.ev}</small></div>`;
  $('out').innerHTML = '<div class="pitch">' + [3, 2, 1, 0].map(i => `<div class="line">${xi[i].map(pl).join('')}</div>`).join('') + '</div>';
});
</script>
</body>
</html>
